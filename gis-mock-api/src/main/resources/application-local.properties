spring.datasource.url=${DATABASE_URL:jdbc:postgresql://database:5432/gis_db}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
# CORS
application.cors.allowed.origins=http://localhost:3000,https://localhost:3001,http://localhost:3001,http://localhost:80,http://localhost:81,http://localhost:8080,http://localhost
# FRONT-END
application.front-end.url=http://localhost:3001

#server.ssl.key-store-type=PKCS12

google.oauth2.client-id=${GOOGLE_CLIENT_ID}
google.oauth2.client-secret=${GOOGLE_CLIENT_SECRET}
google.oauth2.redirect-uri=${APP_LINKS_BASE_URL}/api/google/oauth2/callback
google.oauth2.scopes=https://www.googleapis.com/auth/spreadsheets
google.oauth2.authorize-base-url=https://accounts.google.com/o/oauth2/v2/auth
google.oauth2.token-base-url=https://oauth2.googleapis.com/token





services:
  backend:
    build:
      context: ./gis-mock-api
      dockerfile: Dockerfile
    container_name: gis-mock-api
    env_file:
      - ./.env
    environment:
      - JAVA_OPTS=-Xmx512m
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - app-network

  frontend:
    build:
      context: ./gis-mock-frontend
      dockerfile: Dockerfile
    container_name: gis-mock-frontend
    env_file:
      - ./.env
    environment:
      # Pass the backend URL to the frontend (make sure this matches your backend port)
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:${SERVER_PORT}
    ports:
      - "3001:3000"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - app-network

  nginx:
    image: nginx:stable-alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - './nginx-stage.conf:/etc/nginx/nginx.conf:ro'
      - '/etc/letsencrypt:/etc/letsencrypt:ro'
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_started
      database:
        condition: service_healthy
    networks:
      - app-network


  database:
    image: postgres:14-alpine
    container_name: postgres-db
    env_file:
      - ./.env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5434:5432"
    networks:
      - app-network
    volumes:
      - postgres_gis_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB" ]
      interval: 10s
      timeout: 5s
      retries: 5


networks:
  app-network:
    driver: bridge

volumes:
  postgres_gis_data: { }